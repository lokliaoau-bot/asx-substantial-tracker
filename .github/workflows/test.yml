name: tests

on:
  push:
    paths:
      - "scraper/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OCR (tesseract)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng

      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
