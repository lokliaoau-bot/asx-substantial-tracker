name: debug-probe   # 临时诊断用：摸清 ASX markets/announcements 接口的翻页和筛选参数。不会合并到 main。

on:
  push:
    branches: [debug-corpus]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe
        run: |
          mkdir -p out
          python - <<'PY'
          import json, re, sys, time
          sys.path.insert(0, "scraper")
          import scrape, requests
          S = requests.Session(); S.headers.update(scrape.HEADERS)
          API = "https://asx.api.markitdigital.com/asx-research/1.0/markets/announcements"
          out = {}
          def get(params, label):
              try:
                  r = S.get(API, params=params, timeout=40)
                  j = r.json() if "json" in r.headers.get("Content-Type", "") else None
              except Exception as ex:
                  out[label] = {"error": str(ex)}; return None
              items = ((j or {}).get("data") or {}).get("items") or []
              out[label] = {"status": r.status_code, "url": r.url, "n": len(items),
                            "keys_top": list((j or {}).keys()), "keys_data": [k for k in ((j or {}).get("data") or {}).keys()],
                            "meta": {k: v for k, v in ((j or {}).get("data") or {}).items() if k != "items"},
                            "first": items[0] if items else None,
                            "dates": [items[0]["date"], items[-1]["date"]] if items else None,
                            "types": sorted({t for it in items for t in (it.get("announcementTypes") or [])})[:40],
                            "substantial": [(it.get("symbol"), it.get("headline"), it.get("date"), it.get("documentKey")) for it in items
                                            if re.search(r"substantial", it.get("headline") or "", re.I)][:30]}
              time.sleep(1)
              return items
          get({"page": 0, "itemsPerPage": 100}, "p0_100")
          for p in (5, 20, 60, 150):
              get({"page": p, "itemsPerPage": 100}, f"p{p}_100")
          get({"page": 0, "itemsPerPage": 1000}, "p0_1000")
          # 猜几个筛选参数，看第一条是否变化
          for k, v in [("announcementTypes", "SECURITY HOLDER DETAILS"), ("announcementType", "SECURITY HOLDER DETAILS"),
                       ("types", "SECURITY HOLDER DETAILS"), ("searchText", "substantial"), ("keyword", "substantial"),
                       ("startDate", "2026-10-28"), ("dateFrom", "2026-10-28"), ("fromDate", "2026-10-28"), ("date", "2026-10-28")]:
              get({"page": 0, "itemsPerPage": 50, k: v}, f"f_{k}")
          # 看网站前端怎么调用这个接口
          snippets = []
          try:
              html = S.get("https://www.asx.com.au/markets/trade-our-cash-market/announcements", timeout=40).text
              out["page_html_len"] = len(html)
              srcs = sorted(set(re.findall(r'src="([^"]+\.js[^"]*)"', html)))[:60]
              out["scripts"] = srcs
              for s in srcs:
                  u = s if s.startswith("http") else "https://www.asx.com.au" + s
                  if "asx.com.au" not in u and "markitdigital" not in u: continue
                  try:
                      js = S.get(u, timeout=40).text
                  except Exception: continue
                  for m in re.finditer(r"markets/announcements", js):
                      snippets.append({"src": u, "ctx": js[max(0, m.start()-700): m.end()+700]})
                  for m in re.finditer(r"announcementTypes|itemsPerPage|summaryCountsDate", js):
                      snippets.append({"src": u, "ctx": js[max(0, m.start()-300): m.end()+300]})
                  time.sleep(0.5)
          except Exception as ex:
              out["page_error"] = str(ex)
          out["snippets"] = snippets[:40]
          json.dump(out, open("out/probe2.json", "w"), ensure_ascii=False, indent=1)
          PY
      - name: Push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan debug-probe-out
          git rm -rq --cached .
          git add -f out
          git commit -qm "debug: probe"
          git push -f origin debug-probe-out
