name: scrape-substantial

on:
  workflow_dispatch:            # 只在网页上点“抓取最新公告”时运行（按用户要求去掉了定时任务）

permissions:
  contents: write

concurrency:
  group: scrape-substantial
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04          # 固定系统版本，tesseract 识别结果稳定
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 取分支最新提交，避免排队的任务基于旧版本导致推送冲突

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install OCR (tesseract)
        continue-on-error: true        # 装不上也照样抓取，只是扫描件不做文字识别
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng

      - run: pip install -r requirements.txt

      - name: Scrape ASX
        run: python scraper/scrape.py

      - name: Commit data
        if: ${{ !cancelled() }}         # 抓取失败也提交，让网页能显示失败原因
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "数据没有变化"; exit 0; fi
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          echo "推送失败，请检查仓库的 Workflow permissions 是否为 Read and write" >&2
          exit 1
