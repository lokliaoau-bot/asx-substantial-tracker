name: debug-pdfs   # 临时诊断用：按公告 id 下载 PDF 样本，推到 debug 分支。修复后删除。

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "空格分隔的公告 id"
        required: true

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download PDFs
        env:
          IDS: ${{ inputs.ids }}
        run: |
          mkdir -p debug
          python - <<'EOF'
          import json, os, sys, time
          sys.path.insert(0, "scraper")
          import scrape
          entries = json.load(open("data/all_notices.json"))["entries"]
          for i in os.environ["IDS"].split():
              e = entries.get(i)
              if not e:
                  print("missing", i); continue
              try:
                  data, _ = scrape.download_pdf(e["url"])
                  open(f"debug/{e['code']}_{i}.pdf", "wb").write(data)
                  print("ok", e["code"], i, len(data))
              except Exception as ex:
                  print("fail", e["code"], i, ex)
              time.sleep(1)
          EOF
      - name: Push to debug branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B debug
          git add -f debug
          git commit -m "debug: sample PDFs"
          git push -f origin debug
