name: debug-api-pdfs   # 临时诊断用：下载指定的接口 PDF。不会合并到 main。

on:
  push:
    branches: [debug-api-pdfs]

permissions:
  contents: write

jobs:
  grab:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Grab
        run: |
          mkdir -p out/pdfs
          python - <<'PY'
          import sys, time
          sys.path.insert(0, "scraper")
          import scrape
          for k in ["2924-03150606-2A1705101", "2924-03150529-2A1705065", "2924-03150809-6A1350328",
                    "2924-03150781-2A1705160", "2924-03153386-2A1706223", "2924-03154545-3A705224"]:
              try:
                  data, _ = scrape.download_pdf(scrape.FILE_API + k)
                  open(f"out/pdfs/{k}.pdf", "wb").write(data); print("ok", k, len(data))
              except Exception as ex:
                  print("fail", k, ex)
              time.sleep(1)
          PY
      - name: Push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan debug-api-out2
          git rm -rq --cached .
          git add -f out
          git commit -qm "debug: api pdfs"
          git push -f origin debug-api-out2
