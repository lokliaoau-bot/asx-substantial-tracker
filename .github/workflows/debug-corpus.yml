name: debug-probe   # 临时诊断用：摸清 ASX markets/announcements 接口的翻页和筛选参数。不会合并到 main。

on:
  push:
    branches: [debug-corpus]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe
        run: |
          mkdir -p out
          python - <<'PY'
          import json, re, sys, time
          sys.path.insert(0, "scraper")
          import scrape, requests
          S = requests.Session(); S.headers.update(scrape.HEADERS)
          API = "https://asx.api.markitdigital.com/asx-research/1.0/markets/announcements"
          out = {"pages": [], "substantial": []}
          t0 = time.time()
          for page in range(0, 12):
              t1 = time.time()
              r = S.get(API, params={"page": page, "itemsPerPage": 1000}, timeout=60)
              items = (r.json().get("data") or {}).get("items") or []
              out["pages"].append({"page": page, "status": r.status_code, "n": len(items), "bytes": len(r.content), "secs": round(time.time() - t1, 1),
                                   "first": items[0]["date"] if items else None, "last": items[-1]["date"] if items else None})
              for it in items:
                  if re.search(r"substantial\s+(?:holder|holding|shareholder)", it.get("headline") or "", re.I):
                      out["substantial"].append({k: it.get(k) for k in ("symbol", "headline", "date", "documentKey", "isPriceSensitive", "fileSize", "announcementTypes", "url")})
              if not items:
                  break
              time.sleep(1)
          out["total_secs"] = round(time.time() - t0, 1)
          files = []
          for it in out["substantial"][:3] + out["substantial"][-2:]:
              for u in ("https://asx.api.markitdigital.com/asx-research/1.0/file/" + it["documentKey"],):
                  try:
                      r = S.get(u, timeout=60, allow_redirects=True)
                      files.append({"url": u, "status": r.status_code, "final": r.url, "type": r.headers.get("Content-Type"),
                                    "len": len(r.content), "pdf": r.content[:5] == b"%PDF-", "head": r.text[:300] if r.content[:5] != b"%PDF-" else ""})
                  except Exception as ex:
                      files.append({"url": u, "error": str(ex)})
                  time.sleep(1)
          out["files"] = files
          json.dump(out, open("out/probe3.json", "w"), ensure_ascii=False, indent=1)
          PY
      - name: Push output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan debug-probe3-out
          git rm -rq --cached .
          git add -f out
          git commit -qm "debug: probe3"
          git push -f origin debug-probe3-out
